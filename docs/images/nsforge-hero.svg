<svg width="1200" height="360" viewBox="0 0 1200 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="NSForge - Neurosymbolic Forge: turn concepts into verifiable, traceable formulas">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="0.55" stop-color="#171335"/>
      <stop offset="1" stop-color="#2a1155"/>
    </linearGradient>
    <linearGradient id="heat" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f59e0b"/>
      <stop offset="1" stop-color="#ef4444"/>
    </linearGradient>
    <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#6366f1"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect x="0" y="0" width="1200" height="360" rx="20" fill="url(#bg)"/>
  <rect x="1" y="1" width="1198" height="358" rx="19" fill="none" stroke="#3b326b" stroke-width="2"/>

  <!-- Forge spark mark -->
  <g transform="translate(70,86)">
    <circle cx="34" cy="34" r="34" fill="url(#violet)" opacity="0.18"/>
    <path d="M34 6 L44 30 L68 34 L44 38 L34 62 L24 38 L0 34 L24 30 Z" fill="url(#heat)" filter="url(#soft)"/>
  </g>

  <!-- Wordmark -->
  <text x="158" y="96" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="58" font-weight="800" fill="#f8fafc" letter-spacing="0.5">NSForge</text>
  <text x="160" y="128" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#a78bfa" letter-spacing="6">NEUROSYMBOLIC&#160;&#160;FORGE</text>
  <text x="72" y="184" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" fill="#cbd5e1">Turn <tspan fill="#fbbf24" font-weight="700">concepts</tspan> into <tspan fill="#c4b5fd" font-weight="700">verifiable, traceable formulas</tspan>.</text>

  <!-- Pipeline -->
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <!-- card: base formulas -->
    <g transform="translate(72,224)">
      <rect width="270" height="86" rx="12" fill="#111a2e" stroke="#334155" stroke-width="1.5"/>
      <text x="20" y="34" font-size="15" font-weight="700" fill="#94a3b8">INPUT</text>
      <text x="20" y="62" font-size="20" font-weight="700" fill="#e2e8f0">Base formulas</text>
      <text x="146" y="34" font-size="13" fill="#64748b">F=ma &#183; Arrhenius</text>
    </g>
    <!-- arrow -->
    <path d="M354 267 L404 267" stroke="#8b5cf6" stroke-width="3" marker-end="url(#a)"/>
    <!-- card: forge -->
    <g transform="translate(416,214)">
      <rect width="300" height="106" rx="12" fill="url(#violet)" opacity="0.95"/>
      <text x="22" y="36" font-size="15" font-weight="800" fill="#ede9fe" letter-spacing="1">&#9874; FORGE</text>
      <text x="22" y="66" font-size="19" font-weight="700" fill="#ffffff">compose &#183; derive</text>
      <text x="22" y="90" font-size="19" font-weight="700" fill="#ffffff">verify &#183; prove</text>
    </g>
    <!-- arrow -->
    <path d="M728 267 L778 267" stroke="#f59e0b" stroke-width="3" marker-end="url(#b2)"/>
    <!-- card: output -->
    <g transform="translate(790,224)">
      <rect width="336" height="86" rx="12" fill="#111a2e" stroke="#4c3a2a" stroke-width="1.5"/>
      <text x="20" y="34" font-size="15" font-weight="700" fill="#fbbf24">OUTPUT</text>
      <text x="20" y="62" font-size="20" font-weight="700" fill="#fde68a">New verified formula</text>
      <text x="205" y="34" font-size="13" fill="#a16207">+ provenance</text>
    </g>
  </g>

  <!-- badges strip -->
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="600">
    <rect x="762" y="108" width="330" height="40" rx="20" fill="#0e1830" stroke="#334155"/>
    <text x="786" y="134" fill="#c4b5fd">91 MCP tools</text>
    <circle cx="904" cy="128" r="2.5" fill="#64748b"/>
    <text x="920" y="134" fill="#93c5fd">14-gate harness</text>
  </g>

  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#8b5cf6"/></marker>
    <marker id="b2" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#f59e0b"/></marker>
  </defs>
</svg>
